<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2918" />
      <stop offset="100%" stop-color="#05150b" />
    </linearGradient>
    <linearGradient id="favBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="favTrail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Fundo Squircle com borda verde -->
  <rect x="1.5" y="1.5" width="41" height="41" rx="10" fill="url(#favBg)" stroke="#22c55e" stroke-width="1.8" />

  <!-- Anel de rotação -->
  <circle cx="22" cy="22" r="16.5" fill="none" stroke="url(#favTrail)" stroke-width="1.4" stroke-dasharray="28 14 10 12" />

  <!-- 3 Lâminas de corte -->
  <g>
    <!-- Lâmina 1 -->
    <path d="M 19.4 20.2 C 18.6 15.2, 20.1 10.2, 21.4 6.8 L 23.4 7.6 C 24.6 11.0, 25.2 16.0, 23.5 20.2 Z" fill="url(#favBlade)" />
    <path d="M 21.4 6.8 L 22.0 17.5" stroke="#bbf7d0" stroke-width="0.8" stroke-linecap="round" />

    <!-- Lâmina 2 -->
    <path d="M 24.9 20.6 C 29.6 22.5, 33.2 26.3, 35.5 29.1 L 33.8 30.4 C 30.2 29.8, 25.6 27.8, 22.8 24.2 Z" fill="url(#favBlade)" />
    <path d="M 35.5 29.1 L 25.9 23.0" stroke="#bbf7d0" stroke-width="0.8" stroke-linecap="round" />

    <!-- Lâmina 3 -->
    <path d="M 21.7 25.2 C 17.8 28.3, 12.7 29.5, 9.1 30.1 L 8.8 28.0 C 11.2 25.2, 15.2 22.2, 19.7 21.6 Z" fill="url(#favBlade)" />
    <path d="M 9.1 30.1 L 18.1 23.5" stroke="#bbf7d0" stroke-width="0.8" stroke-linecap="round" />

    <!-- Flange Central -->
    <circle cx="22" cy="22" r="5.2" fill="#081b0e" stroke="#22c55e" stroke-width="1.2" />
    <circle cx="22" cy="22" r="3.6" fill="#14532d" />

    <!-- Folha Verde Central -->
    <path d="M 22 18.5 C 23.8 19.8 24.2 21.6 23.4 23.0 C 22.8 24.2 22 24.8 22 24.8 C 22 24.8 21.2 24.2 20.6 23.0 C 19.8 21.6 20.2 19.8 22 18.5 Z" fill="#86efac" />
    <path d="M 22 19 L 22 24.2" stroke="#14532d" stroke-width="0.6" stroke-linecap="round" />
  </g>
</svg>